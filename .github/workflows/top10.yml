name: Atualizar Top 10 Brasil

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Subir o FlareSolverr
        run: |
          docker run -d --name flaresolverr -p 8191:8191 \
            -e LOG_LEVEL=info flaresolverr/flaresolverr:latest
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8191/health >/dev/null; then
              echo "FlareSolverr pronto"
              exit 0
            fi
            sleep 2
          done
          echo "FlareSolverr não subiu"
          exit 1

      - name: Baixar rankings e montar o JSON
        run: node scripts/fetch-top10.mjs

      - name: Publicar o JSON atualizado
        run: |
          if git diff --quiet -- top10-brasil.json; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top10-brasil.json
          git commit -m "Atualiza Top 10 Brasil"
          git push
